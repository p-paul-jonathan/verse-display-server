<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verse Display Server</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };

    if (
      localStorage.theme === 'dark' ||
      (!('theme' in localStorage) &&
        window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-100 to-gray-200 text-gray-900 dark:from-gray-900 dark:to-gray-800 dark:text-gray-100 transition-colors duration-500">

  <div class="w-full max-w-md sm:max-w-lg mx-4 bg-white dark:bg-gray-900 rounded-2xl shadow-xl p-5 sm:p-8 transition-colors duration-500">

    <h2 class="text-2xl sm:text-3xl font-bold text-center mb-6 sm:mb-8">
      📖 Verse Display Server
    </h2>

    <form method="POST" class="space-y-4 sm:space-y-5">

      <!-- Book -->
      <div>
        <label for="book" class="block text-sm font-semibold mb-2">Book</label>
        <select id="book" name="book"
          class="w-full text-base rounded-xl border border-gray-300 dark:border-gray-600
                 px-3 py-2 shadow-md
                 focus:ring-2 focus:ring-purple-500 focus:border-purple-500
                 text-gray-800 dark:text-gray-100 dark:bg-gray-800">
          <option value="">-- Choose a Book --</option>
          {% for book in books %}
            <option value="{{ book.english }}"
              {% if selection and book.english == selection.book_en %}selected{% endif %}>
              {{ book.english }} | {{ book.hindi }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Chapter -->
      <div>
        <label for="chapter" class="block text-sm font-semibold mb-2">Chapter</label>
        <select id="chapter" name="chapter"
          class="w-full text-base rounded-xl border border-gray-300 dark:border-gray-600
                 px-3 py-2 shadow-md
                 focus:ring-2 focus:ring-purple-500 focus:border-purple-500
                 text-gray-800 dark:text-gray-100 dark:bg-gray-800">
          <option value="">-- Choose Chapter --</option>
          {% for i in range(1, 151) %}
            <option value="{{ i }}"
              {% if selection and selection.chapter == i|string %}selected{% endif %}>
              {{ i }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Verses -->
      <div>
        <label for="verses" class="block text-sm font-semibold mb-2">Verse(s)</label>
        <input
          type="text"
          id="verses"
          name="verses"
          inputmode="numeric"
          pattern="[0-9,\-\s]*"
          placeholder="e.g. 1, 2-5, 10"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          value="{% if selection %}{{ selection.verses }}{% endif %}"
          class="w-full text-base rounded-xl border border-gray-300 dark:border-gray-600
                 px-3 py-2 shadow-md
                 focus:ring-2 focus:ring-purple-500 focus:border-purple-500
                 text-gray-800 dark:text-gray-100 dark:bg-gray-800" />
      </div>

      <!-- Actions -->
      <div class="pt-4 flex flex-col sm:flex-row gap-3 sm:justify-between">
        <button
          type="submit"
          name="action"
          value="submit"
          class="w-full sm:w-auto px-6 py-3 bg-purple-600 hover:bg-purple-700
                 text-white font-semibold rounded-xl shadow-md
                 transition-all duration-200 hover:scale-[1.02]">
          Save
        </button>

        <button
          type="submit"
          name="action"
          value="clear"
          class="w-full sm:w-auto px-6 py-3 border border-red-500
                 text-red-600 dark:text-red-400
                 hover:bg-red-50 dark:hover:bg-red-900/20
                 font-semibold rounded-xl transition-all duration-200 hover:scale-[1.02]">
          Clear
        </button>
      </div>
    </form>

    {% if selection %}
      <div class="mt-6 sm:mt-8 p-3 sm:p-4 rounded-xl bg-purple-50 dark:bg-purple-900/30
                  border-l-4 border-purple-500 text-center text-base sm:text-lg
                  font-medium shadow-sm">
        ✅ Current:
        <strong class="text-gray-900 dark:text-gray-100">
          {{ selection.book_en }} | {{ selection.book_hi }}
        </strong>
        {{ selection.chapter }}:{{ selection.verses }}
      </div>

      <div class="mt-5 sm:mt-6 flex justify-center px-2">
        <a href="/display" target="_blank"
          class="inline-block w-full sm:w-auto px-6 sm:px-8 py-3 sm:py-4
                 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600
                 hover:from-blue-600 hover:to-purple-600
                 text-white text-base sm:text-lg font-bold text-center
                 shadow-[0_0_20px_rgba(147,51,234,0.4)]
                 hover:shadow-[0_0_30px_rgba(99,102,241,0.6)]
                 transition-all duration-300 hover:scale-105 active:scale-95">
          📖 View Verse
        </a>
      </div>
    {% endif %}

    {% if message %}
      <div class="mt-5 text-center text-green-600 dark:text-green-400 font-semibold">
        {{ message }}
      </div>
    {% endif %}
  </div>

  <!-- Theme Toggle -->
  <button id="theme-toggle"
    class="fixed bottom-4 right-4 sm:bottom-6 sm:left-6 sm:right-auto
           p-3 rounded-full bg-gray-200 dark:bg-gray-700
           text-gray-800 dark:text-gray-100 text-3xl
           shadow-lg hover:scale-110 transition-all duration-200"
    title="Toggle Dark Mode">
    🌙
  </button>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const html = document.documentElement;

    function setTheme(mode) {
      if (mode === 'dark') {
        html.classList.add('dark');
        localStorage.theme = 'dark';
        toggleBtn.textContent = '☀️';
      } else {
        html.classList.remove('dark');
        localStorage.theme = 'light';
        toggleBtn.textContent = '🌙';
      }
    }

    toggleBtn.textContent = html.classList.contains('dark') ? '☀️' : '🌙';

    toggleBtn.addEventListener('click', () => {
      setTheme(html.classList.contains('dark') ? 'light' : 'dark');
    });
  </script>

</body>
</html>
